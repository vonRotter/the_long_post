[pytest]
testpaths = tests
# The two proofs — 300 generated worlds and 120 headless ten-year runs — take
# eighty-five of the suite's hundred and twenty seconds. They are the tests
# that guarantee the design rather than the code, so they are worth their time
# in CI and not worth it between two edits. `pytest` skips them; `pytest -m
# slow` runs only them; `pytest -m ""` runs everything.
addopts = -m "not slow"
markers =
    slow: proofs over many seeds or many runs — the design guarantees
